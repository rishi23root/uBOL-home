name: Build Extension and Create Artifacts

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release with separate ZIPs per platform'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g. v1.0.0) - required if create_release is true'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: Install uBlock dependencies
        run: |
          npm install --prefix uBlock

      - name: Build uBlock Chromium (base extension)
        run: |
          make -C uBlock/ mv3-chromium
          rm -rf chromium
          mv uBlock/dist/build/uBOLite.chromium chromium

      - name: Run custom build script
        run: |
          chmod +x build-scripts/build-custom.sh
          ./build-scripts/build-custom.sh

      - name: Create Chrome ZIP (no nested zips)
        run: |
          mkdir -p dist
          cd custom-dist/chromium
          # Exclude any .zip files to prevent zip-in-zip (bad UX)
          zip -r ../../dist/adwarden-chrome.zip . -x "*.zip"
          cd ../..
          echo "Created dist/adwarden-chrome.zip (extension files at root, no recursive zips)"
          ls -la dist/

      - name: Upload Chrome extension (directory)
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: custom-dist/chromium/
          retention-days: 7

      - name: Upload Chrome ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: dist/adwarden-chrome.zip
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Chrome build complete (custom-dist/chromium)" >> $GITHUB_STEP_SUMMARY
          echo "✅ ZIP artifact: simple zip, no recursive zips inside" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **chrome-extension**: extension directory (load unpacked)" >> $GITHUB_STEP_SUMMARY
          echo "- **chrome-extension-zip**: adwarden-chrome.zip (load as packed extension)" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/custom')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release operations)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete existing preview release (so we can update it on each push)
        if: github.event_name == 'push'
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Create release ZIP (simple zip, no zip-in-zip)
        run: |
          mkdir -p release-assets
          cd chrome-extension
          # -x "*.zip" ensures no recursive zips (bad UX)
          zip -r ../release-assets/adwarden-chrome.zip . -x "*.zip"
          cd ..
          echo "Release ZIP (extension files at root, no recursive zips):"
          ls -la release-assets/

      - name: Determine release tag and type
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.create_release }}" = "true" ]; then
            if [ -z "${{ github.event.inputs.release_tag }}" ]; then
              echo "::error::release_tag is required when create_release is true"
              exit 1
            fi
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=preview" >> $GITHUB_OUTPUT
            echo "draft=true" >> $GITHUB_OUTPUT
            echo "name=Preview (build ${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Assemble release body
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -f .github/workflows/RELEASE_BODY.md ]; then
            sed "s/%tag%/$TAG/g" .github/workflows/RELEASE_BODY.md > release_body.txt
          else
            echo "## ${{ steps.tag.outputs.name }}" > release_body.txt
            echo "" >> release_body.txt
            echo "**Chrome extension:**" >> release_body.txt
            echo "- adwarden-chrome.zip (load in chrome://extensions)" >> release_body.txt
          fi

      - name: Create GitHub release (preview on push, final on workflow_dispatch)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release_body.txt
          draft: ${{ steps.tag.outputs.draft }}
          files: release-assets/*.zip
